<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Border Radius Generator</title>
  <link rel="stylesheet" href="./style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

</head>
<body>
<!-- partial:index.partial.html -->

    <div class="container">
        <div class="box">
            <div class="screen">
                <div class="shape"></div>
            </div>
            <div class="code-cont">
                <span class="code">
                    border-radius: <span class="code-value">0px 0px 0px 0px</span>
                </span>
            </div>
            <br>
            <div class="controls clear-fix">
                <div class="float-left">
                    <label for="radius-top">Top</label>
                    <br>
                    <input id="radius-top" class="range top m-3" type="range">
                    <br>
                    <label for="radius-right">Right</label>
                    <br>
                    <input id="radius-right" class="range right m-3" type="range">
                </div>
                <div class="float-right">
                    <label for="radius-bottom">Bottom</label>
                    <br>
                    <input id="radius-bottom" class="range bottom m-3" type="range">
                    <br>
                    <label for="radius-left">Left</label>
                    <br>
                    <input id="radius-left" class="range left m-3" type="range">
                </div>
            </div>
        </div>
    </div>
<!-- partial -->
  <script  src="./script.js"></script>

</body>
</html>
