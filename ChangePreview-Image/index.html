<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>Change Preview Image</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" href="css/style.css" />

</head>

<body>

	<!-- first page -->
	<div class="product">
		<div class="main-img">
			<img src="img/headphone_blue.png" class="pro-img" alt="product" />
		</div>
		<div class="thumb-img">
			<div class="box active" role="button" tabindex="0" onclick="changeImage(this,`.thumb-img`,`.pro-img`)">
				<img src="img/headphone_blue.png" alt="Show blue headphones" />
			</div>
			<div class="box" role="button" tabindex="0" onclick="changeImage(this,`.thumb-img`,`.pro-img`)">
				<img src="img/headphone_pink.png" alt="Show pink headphones" />
			</div>
			<div class="box" role="button" tabindex="0" onclick="changeImage(this,`.thumb-img`,`.pro-img`)">
				<img src="img/headphone_red.png" alt="Show red headphones" />
			</div>
		</div>
	</div>
<!-- ----------------------------------------------------------------------------------------- -->
	<!-- second page -->
	<div class="product">
		<div class="main-img">
			<img src="img/headphone_blue.png" class="pro-img two" alt="product" />
		</div>
		<div class="thumb-img two">
			<div class="box active" role="button" tabindex="0" onclick="changeImage(this,`.thumb-img.two`,`.pro-img.two`)">
				<img src="img/headphone_blue.png" alt="Show blue headphones" />
			</div>
			<div class="box" role="button" tabindex="0" onclick="changeImage(this,`.thumb-img.two`,`.pro-img.two`)">
				<img src="img/headphone_pink.png" alt="Show pink headphones" />
			</div>
			<div class="box" role="button" tabindex="0" onclick="changeImage(this,`.thumb-img.two`,`.pro-img.two`)">
				<img src="img/headphone_red.png" alt="Show red headphones" />
			</div>
		</div>
	</div>


<!-- ------------------------------------------------------------------------------------------------------ -->

<script src="main.js"></script>

</body>

</html>
